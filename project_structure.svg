<svg width="1200" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.1" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGradient)" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">
    🎧 Структура проекта Micro_earpiece
  </text>
  
  <!-- Main Classes Section -->
  <rect x="50" y="80" width="280" height="350" fill="#fff59d" stroke="#f57c00" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="190" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">
    📋 Основные классы
  </text>
  
  <!-- Program.cs -->
  <rect x="70" y="120" width="240" height="80" fill="#ffffff" stroke="#f57c00" stroke-width="1" rx="5"/>
  <text x="90" y="140" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">📋 Program.cs</text>
  <text x="90" y="155" font-family="Arial, sans-serif" font-size="11" fill="#666">• Точка входа приложения</text>
  <text x="90" y="170" font-family="Arial, sans-serif" font-size="11" fill="#666">• Инициализация компонентов</text>
  <text x="90" y="185" font-family="Arial, sans-serif" font-size="11" fill="#666">• Главный цикл прослушивания</text>
  
  <!-- Config.cs -->
  <rect x="70" y="210" width="240" height="100" fill="#ffffff" stroke="#f57c00" stroke-width="1" rx="5"/>
  <text x="90" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">⚙️ Config.cs</text>
  <text x="90" y="245" font-family="Arial, sans-serif" font-size="11" fill="#666">• SampleRate: 44100 Hz</text>
  <text x="90" y="260" font-family="Arial, sans-serif" font-size="11" fill="#666">• BufferSize: 2048</text>
  <text x="90" y="275" font-family="Arial, sans-serif" font-size="11" fill="#666">• BeepHz: 1119 Hz ± 100</text>
  <text x="90" y="290" font-family="Arial, sans-serif" font-size="11" fill="#666">• CountValidityBeeps: 15</text>
  <text x="90" y="305" font-family="Arial, sans-serif" font-size="11" fill="#666">• MainFold: "AudioFiles"</text>
  
  <!-- Funcs.cs -->
  <rect x="70" y="320" width="240" height="100" fill="#ffffff" stroke="#f57c00" stroke-width="1" rx="5"/>
  <text x="90" y="340" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">🔧 Funcs.cs</text>
  <text x="90" y="355" font-family="Arial, sans-serif" font-size="11" fill="#666">• OnDataAvailable() - обработка звука</text>
  <text x="90" y="370" font-family="Arial, sans-serif" font-size="11" fill="#666">• BeepDetected() - обнаружение писка</text>
  <text x="90" y="385" font-family="Arial, sans-serif" font-size="11" fill="#666">• AudioPlay() - воспроизведение</text>
  <text x="90" y="400" font-family="Arial, sans-serif" font-size="11" fill="#666">• NextAudio() - переключение</text>
  <text x="90" y="415" font-family="Arial, sans-serif" font-size="11" fill="#666">• AudioStop() - остановка</text>
  
  <!-- File System Section -->
  <rect x="360" y="80" width="280" height="350" fill="#ffccbc" stroke="#f57c00" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="500" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">
    📁 Файловая система
  </text>
  
  <!-- config.txt -->
  <rect x="380" y="120" width="240" height="50" fill="#ffffff" stroke="#f57c00" stroke-width="1" rx="5"/>
  <text x="400" y="140" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">📄 config.txt</text>
  <text x="400" y="155" font-family="Arial, sans-serif" font-size="11" fill="#666">Конфигурационный файл</text>
  
  <!-- AudioFiles folder -->
  <rect x="380" y="180" width="240" height="60" fill="#ffffff" stroke="#f57c00" stroke-width="1" rx="5"/>
  <text x="400" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">📁 AudioFiles/</text>
  <text x="400" y="215" font-family="Arial, sans-serif" font-size="11" fill="#666">Главная папка с аудио</text>
  <text x="400" y="230" font-family="Arial, sans-serif" font-size="11" fill="#666">├── *.mp3, *.wav, *.m4a</text>
  
  <!-- Subfolders -->
  <rect x="380" y="250" width="240" height="70" fill="#ffffff" stroke="#f57c00" stroke-width="1" rx="5"/>
  <text x="400" y="270" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">📂 Подпапки</text>
  <text x="400" y="285" font-family="Arial, sans-serif" font-size="11" fill="#666">audio1/ → audio1.mp3</text>
  <text x="400" y="300" font-family="Arial, sans-serif" font-size="11" fill="#666">├── sub1.wav</text>
  <text x="400" y="315" font-family="Arial, sans-serif" font-size="11" fill="#666">└── sub2.mp3</text>
  
  <!-- Supported formats -->
  <rect x="380" y="330" width="240" height="90" fill="#ffffff" stroke="#f57c00" stroke-width="1" rx="5"/>
  <text x="400" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">🎵 Поддерживаемые форматы</text>
  <text x="400" y="365" font-family="Arial, sans-serif" font-size="11" fill="#666">• MP3 - сжатый аудио</text>
  <text x="400" y="380" font-family="Arial, sans-serif" font-size="11" fill="#666">• WAV - несжатый аудио</text>
  <text x="400" y="395" font-family="Arial, sans-serif" font-size="11" fill="#666">• M4A - AAC формат</text>
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="11" fill="#666">Автоматическое сканирование</text>
  
  <!-- Components Section -->
  <rect x="670" y="80" width="280" height="350" fill="#f8bbd9" stroke="#c2185b" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="810" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">
    🔧 Компоненты системы
  </text>
  
  <!-- Microphone -->
  <rect x="690" y="120" width="240" height="50" fill="#ffffff" stroke="#c2185b" stroke-width="1" rx="5"/>
  <text x="710" y="140" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">🎤 Микрофон</text>
  <text x="710" y="155" font-family="Arial, sans-serif" font-size="11" fill="#666">Захват звука в реальном времени</text>
  
  <!-- FFT Analysis -->
  <rect x="690" y="180" width="240" height="50" fill="#ffffff" stroke="#c2185b" stroke-width="1" rx="5"/>
  <text x="710" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">📈 FFT Анализ</text>
  <text x="710" y="215" font-family="Arial, sans-serif" font-size="11" fill="#666">Преобразование Фурье для частот</text>
  
  <!-- Beep Detector -->
  <rect x="690" y="240" width="240" height="60" fill="#ffffff" stroke="#c2185b" stroke-width="1" rx="5"/>
  <text x="710" y="260" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">🔍 Детектор писка</text>
  <text x="710" y="275" font-family="Arial, sans-serif" font-size="11" fill="#666">Поиск частоты 1119 Hz ± 100</text>
  <text x="710" y="290" font-family="Arial, sans-serif" font-size="11" fill="#666">15 подтверждений для валидности</text>
  
  <!-- Audio Player -->
  <rect x="690" y="310" width="240" height="60" fill="#ffffff" stroke="#c2185b" stroke-width="1" rx="5"/>
  <text x="710" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">🔊 Аудиоплеер</text>
  <text x="710" y="345" font-family="Arial, sans-serif" font-size="11" fill="#666">Асинхронное воспроизведение</text>
  <text x="710" y="360" font-family="Arial, sans-serif" font-size="11" fill="#666">Управление через CancellationToken</text>
  
  <!-- Dependencies Section -->
  <rect x="980" y="80" width="200" height="350" fill="#bbdefb" stroke="#1976d2" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="1080" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">
    📦 Зависимости
  </text>
  
  <!-- NAudio -->
  <rect x="990" y="120" width="180" height="100" fill="#ffffff" stroke="#1976d2" stroke-width="1" rx="5"/>
  <text x="1000" y="140" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">🎧 NAudio.Wave</text>
  <text x="1000" y="155" font-family="Arial, sans-serif" font-size="10" fill="#666">• WaveInEvent</text>
  <text x="1000" y="170" font-family="Arial, sans-serif" font-size="10" fill="#666">• AudioFileReader</text>
  <text x="1000" y="185" font-family="Arial, sans-serif" font-size="10" fill="#666">• WaveOutEvent</text>
  <text x="1000" y="200" font-family="Arial, sans-serif" font-size="10" fill="#666">• WaveFormat</text>
  <text x="1000" y="215" font-family="Arial, sans-serif" font-size="10" fill="#666">Работа с аудио I/O</text>
  
  <!-- MathNet -->
  <rect x="990" y="230" width="180" height="100" fill="#ffffff" stroke="#1976d2" stroke-width="1" rx="5"/>
  <text x="1000" y="250" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">📊 MathNet.Numerics</text>
  <text x="1000" y="265" font-family="Arial, sans-serif" font-size="10" fill="#666">• FFT Transform</text>
  <text x="1000" y="280" font-family="Arial, sans-serif" font-size="10" fill="#666">• Complex numbers</text>
  <text x="1000" y="295" font-family="Arial, sans-serif" font-size="10" fill="#666">• Signal processing</text>
  <text x="1000" y="310" font-family="Arial, sans-serif" font-size="10" fill="#666">• Fourier.Forward()</text>
  <text x="1000" y="325" font-family="Arial, sans-serif" font-size="10" fill="#666">Математические операции</text>
  
  <!-- Data Flow Section -->
  <rect x="50" y="460" width="1130" height="120" fill="#e8f5e8" stroke="#388e3c" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="615" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">
    🔄 Поток обработки данных
  </text>
  
  <!-- Flow steps -->
  <rect x="80" y="500" width="140" height="60" fill="#ffffff" stroke="#388e3c" stroke-width="1" rx="5"/>
  <text x="150" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">🎤 Захват</text>
  <text x="150" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Микрофон</text>
  <text x="150" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">WaveInEvent</text>
  
  <rect x="260" y="500" width="140" height="60" fill="#ffffff" stroke="#388e3c" stroke-width="1" rx="5"/>
  <text x="330" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">📊 FFT</text>
  <text x="330" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Анализ частот</text>
  <text x="330" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Fourier.Forward</text>
  
  <rect x="440" y="500" width="140" height="60" fill="#ffffff" stroke="#388e3c" stroke-width="1" rx="5"/>
  <text x="510" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">🔍 Детекция</text>
  <text x="510" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Поиск 1119 Hz</text>
  <text x="510" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">±100 Hz</text>
  
  <rect x="620" y="500" width="140" height="60" fill="#ffffff" stroke="#388e3c" stroke-width="1" rx="5"/>
  <text x="690" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">📁 Навигация</text>
  <text x="690" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Переход в папку</text>
  <text x="690" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">BeepDetected()</text>
  
  <rect x="800" y="500" width="140" height="60" fill="#ffffff" stroke="#388e3c" stroke-width="1" rx="5"/>
  <text x="870" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">🔊 Воспроизведение</text>
  <text x="870" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">AudioPlay()</text>
  <text x="870" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">WaveOutEvent</text>
  
  <rect x="980" y="500" width="140" height="60" fill="#ffffff" stroke="#388e3c" stroke-width="1" rx="5"/>
  <text x="1050" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">🔄 Цикл</text>
  <text x="1050" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">NextAudio()</text>
  <text x="1050" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Повтор</text>
  
  <!-- Flow arrows -->
  <line x1="220" y1="530" x2="250" y2="530" stroke="#667eea" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="530" x2="430" y2="530" stroke="#667eea" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="580" y1="530" x2="610" y2="530" stroke="#667eea" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="760" y1="530" x2="790" y2="530" stroke="#667eea" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="940" y1="530" x2="970" y2="530" stroke="#667eea" stroke-width="3" marker-end="url(#arrowhead)"/>
  
 
</svg>